name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmvs_js
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmvs_js.dmf
          test -f build/dmf/test_dmvs_js.dmf
          test -f build/dmf/dmvs_js_version.txt
          echo "Module files present"

      - name: Run tests
        # API placeholders are explicitly disabled in CTest until implemented.
        run: ctest --test-dir build --output-on-failure
